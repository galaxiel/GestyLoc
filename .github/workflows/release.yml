# Publication automatique d'une release GitHub à chaque push de tag v*.
# L'updater de l'app installée lira alors latest.yml + le .exe de la release.
#
# NB : on n'utilise PAS electron-builder --publish — son éditeur GitHub crée
# parfois deux drafts en parallèle (bug connu) et perd le .blockmap. À la
# place : build local, puis création de la draft + upload déterministes
# (4 fichiers vérifiés, sinon le workflow échoue).
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint — bloque la release si rouge)
        run: npm run lint

      - name: Tests (vitest — bloque la release si rouge)
        run: npm test

      - name: Build
        run: npm run build && npx electron-builder --win nsis --publish never

      - name: Zip portable (app complète + marqueur, extrait tel quel)
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          $ver = $tag.TrimStart('v')
          New-Item -ItemType Directory "dist/GestyLoc-portable" -Force | Out-Null
          Copy-Item "dist/win-unpacked/*" "dist/GestyLoc-portable/" -Recurse -Force
          New-Item -ItemType File "dist/GestyLoc-portable/PORTABLE" -Force | Out-Null
          Compress-Archive -Path "dist/GestyLoc-portable" -DestinationPath "dist/GestyLoc-$ver-portable.zip" -Force

      - name: Créer la draft release et uploader les 4 fichiers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          $ver = $tag.TrimStart('v')

          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --draft --title $ver --generate-notes
          }

          $fichiers = @(
            "dist/GestyLoc-$ver-setup.exe",
            "dist/GestyLoc-$ver-setup.exe.blockmap",
            "dist/GestyLoc-$ver-portable.zip",
            "dist/latest.yml"
          )
          foreach ($f in $fichiers) {
            if (-not (Test-Path $f)) { throw "FICHIER MANQUANT : $f" }
          }
          gh release upload $tag $fichiers --clobber
          Write-Host "4 fichiers uploadés sur la draft $tag"

      # L'app n'étant pas signée, l'empreinte SHA-256 publiée est le seul
      # contrôle d'intégrité offert à l'utilisateur. On l'écrit dans les NOTES
      # de la release et non comme 5e asset (la règle « exactement 4 assets »
      # reste vraie, et electron-updater n'a rien à faire d'un fichier en plus).
      - name: Empreintes SHA-256 dans les notes de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          $ver = $tag.TrimStart('v')
          $marqueur = '### Empreintes SHA-256'

          $fichiers = @(
            "dist/GestyLoc-$ver-setup.exe",
            "dist/GestyLoc-$ver-setup.exe.blockmap",
            "dist/GestyLoc-$ver-portable.zip",
            "dist/latest.yml"
          )
          foreach ($f in $fichiers) {
            if (-not (Test-Path $f)) { throw "FICHIER MANQUANT : $f" }
          }

          # Corps existant, débarrassé d'un bloc d'empreintes déjà présent
          # (le workflow peut être relancé sur le même tag).
          $body = gh release view $tag --json body -q .body
          if ($null -eq $body) { $body = '' }
          $pos = $body.IndexOf($marqueur)
          if ($pos -ge 0) { $body = $body.Substring(0, $pos).TrimEnd() }

          $bloc = @()
          $bloc += ''
          $bloc += ''
          $bloc += $marqueur
          $bloc += ''
          $bloc += "Empreintes des fichiers de cette version, pour vérifier qu'un téléchargement n'a pas été altéré :"
          $bloc += ''
          $bloc += '- Windows : `certutil -hashfile <fichier> SHA256`'
          $bloc += '- Linux / macOS : `sha256sum <fichier>`'
          $bloc += ''
          $bloc += '```text'
          foreach ($f in $fichiers) {
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
            $bloc += "$h  $(Split-Path $f -Leaf)"
          }
          $bloc += '```'
          $bloc += ''
          $bloc += "Ces empreintes prouvent l'intégrité des fichiers, pas l'identité de l'éditeur : GestyLoc n'est pas signé par un certificat de signature de code."

          $notes = Join-Path $env:RUNNER_TEMP 'notes-release.md'
          Set-Content -Path $notes -Value ($body + ($bloc -join "`n")) -Encoding utf8
          gh release edit $tag --notes-file $notes
          Write-Host "Empreintes SHA-256 ajoutées aux notes de $tag"
